# Sumsub integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in sumsub-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: sumsub-kantara-initiative-trust-status-list
  label: Kantara Initiative (Trust Status List)
  partner_name: Kantara Initiative (Trust Status List)
  category: Identity assurance certification
  type: register
  channel: standard-directory
  evidence: https://kantarainitiative.org/trust-status-list/
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Kantara Initiative Trust Status List (kantarainitiative.org/trust-status-list)
    spec_file: null
    standard: Kantara Identity Assurance (NIST SP 800-63)
    role: kantara-registered-applicant
    registered_name: Sumsub
    register_id: Sumsub
    website: www.sumsub.com
    matched_domain: sumsub.com
    matched_by: domain
    kantara_services:
    - service: Sumsub Identity Verification Service (NIST)
      scheme: NIST 800-63 rev.3
      assurance_levels: IAL2; IAL3
      status: ''
      approval: null
      expiry: '2027-03-31'
      table: registered_applicants
    signal_note: certified_products = one entry per approved service TYPE (Full / Component / Classic), lapsed unless
      Good Standing and inside the triennial approval; registered applicants are participation only; services and
      assurance levels are context
    detected_by: sweep-regtech-aml.py
    detected: '2026-10-15'
  status: not-a-workflow
  arazzo: null
- slug: sumsub-nist-frte-fate-face-recognition-technology-evaluation
  label: NIST FRTE/FATE (face recognition technology evaluation)
  partner_name: NIST FRTE/FATE (face recognition technology evaluation)
  category: biometric algorithm evaluation
  type: register
  channel: standard-directory
  evidence: https://pages.nist.gov/frvt/html/frvt11.html
  source: edge
  relationship: standard-participant
  contract_reference:
    register: 'NIST FRTE / FATE (pages.nist.gov/frvt: 1:1, 1:N, age estimation, paperless travel, twins)'
    standard: NIST FRTE/FATE
    spec_file: null
    role: nist-frte-participant
    registered_name: Sum and Substance Ltd
    registered_country: GB
    register_id: https://pages.nist.gov/frvt/html/frvt11.html
    matched_domain: sumsub.com
    matched_by: domain+verified
    identity: 'hand-verified: Sum and Substance Ltd is Sumsub''s legal entity'
    identity_source: hand-verified (LOCAL_VERIFIED)
    tracks:
    - frte-1to1
    - frte-1toN
    signals:
      best_1to1_rank: 31
      top10_1to1: false
    signal_note: 'participation only: NIST evaluates, it does not certify. A top-tier rank is a signal recorded
      for context, never certified_products, and algorithm / track counts are never counted'
    detected_by: sweep-biometrics-testing.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
- slug: sumsub-ibeta-iso-iec-30107-3-presentation-attack-detection
  label: iBeta (ISO/IEC 30107-3 presentation attack detection)
  partner_name: iBeta (ISO/IEC 30107-3 presentation attack detection)
  category: biometric conformance (PAD)
  type: register
  channel: standard-directory
  evidence: https://www.ibeta.com/iso-30107-3-presentation-attack-detection-confirmation-letters/
  source: edge
  relationship: standard-participant
  contract_reference:
    register: iBeta ISO/IEC 30107-3 PAD confirmation letters (ibeta.com, NIST NVLAP-accredited lab)
    standard: ISO/IEC 30107-3 (iBeta PAD)
    spec_file: null
    role: ibeta-pad-confirmed
    registered_name: Sum and Substance
    register_id: https://www.ibeta.com/wp-content/uploads/2023/02/210311-Sum-and-Substance-PAD-Level-1-Confirmation-Letter-1.pdf
    matched_domain: sumsub.com
    matched_by: domain+verified
    identity: 'hand-verified: Sum and Substance is Sumsub''s legal entity'
    identity_source: hand-verified (LOCAL_VERIFIED)
    certified_products:
    - product: ISO/IEC 30107-3 PAD (face)
      modality: face
      partner_tier: Level 1
      lapsed: false
      latest_letter: '2021-03-11'
      products_tested:
      - Prooface
    signal_note: certified_products = ONE entry per PAD product type (modality), highest level confirmed in partner_tier;
      letters and versions are never counted. iBeta letters carry no expiry, so lapsed is false and the latest letter
      date is recorded
    detected_by: sweep-biometrics-testing.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
